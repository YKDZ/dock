name: 发布

on:
  workflow_dispatch:

concurrency:
  group: dock-release
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'YKDZ/dock'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts restore
      - if: steps.restore.outputs.restored != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      - if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-release
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      receipt-artifact: ${{ steps.receipt.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: .artifacts/release
      - run: pnpm release:publish
      - run: pnpm release:registry
      - id: receipt
        run: echo "name=registry-acceptance-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.receipt.outputs.name }}
          path: .artifacts/release/registry-accepted.json
          if-no-files-found: error
          retention-days: 90

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: .artifacts/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.publish.outputs.receipt-artifact }}
          path: .artifacts/release
      - run: pnpm release:github
        env:
          GH_TOKEN: ${{ github.token }}
